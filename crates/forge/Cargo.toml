[package]
name = "gitgui-forge"
description = "Signing in to GitHub (device flow) and reading a repository's pull requests and issues"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# Where the sign-in is kept: the system's own credential store, never a file of ours.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
