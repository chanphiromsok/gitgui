[package]
name = "gitgui-app"
description = "GPUI front end for gitgui-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gitgui-app"
path = "src/main.rs"

[dependencies]
gitgui-core = { path = "../core" }
gitgui-store = { path = "../store" }
# runtime_shaders: compile Metal shaders at startup; Xcode 26 ships without the Metal Toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
# Icons are drawn to pixels here: GPUI 0.2's own SVG images come out with red and blue swapped.
resvg = "0.45"
image = { version = "0.25", default-features = false }
# Author pictures: fetched from GitHub or Gravatar, which is keyed by a SHA-256 of the email.
ureq = "3"
sha2 = "0.10"
serde_json = "1"
# Syntax highlighting in the diff: tree-sitter grammars and their highlight queries.
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[dev-dependencies]
# Parses the built-in icons in tests, as GPUI does when it draws them.
usvg = "0.45"
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
