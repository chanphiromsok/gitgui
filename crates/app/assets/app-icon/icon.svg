<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323848"/>
      <stop offset="1" stop-color="#15171d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#4fc1ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#4fc1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- The body: macOS's icon grid, an 824-pixel rounded square. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- The graph: a trunk, and a branch cut from one of its commits, with HEAD at the branch's tip. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="42">
    <path d="M400 290 V790" stroke="#4fc1ff"/>
    <path d="M400 650 C400 560 624 590 624 490 V300" stroke="#c586c0"/>
  </g>
  <g filter="url(#nodeShadow)">
    <circle cx="400" cy="790" r="48" fill="#4fc1ff"/>
    <!-- The commit the branch was cut from: the fork point. -->
    <circle cx="400" cy="650" r="48" fill="#4fc1ff"/>
    <circle cx="400" cy="470" r="48" fill="#4fc1ff"/>
    <circle cx="400" cy="290" r="48" fill="#4fc1ff"/>
    <circle cx="624" cy="480" r="48" fill="#c586c0"/>
    <!-- The current commit: ringed, as in the app. -->
    <circle cx="624" cy="282" r="74" fill="#1b1e26" stroke="#ffffff" stroke-width="16"/>
    <circle cx="624" cy="282" r="42" fill="#c586c0"/>
  </g>
</svg>
